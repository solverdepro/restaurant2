{% extends "base.html" %}
{% block title %}Edit Staff - Misosi Pluss++{% endblock %}

{% block content %}
<main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
    <h2 class="text-2xl font-bold mb-6">Edit Staff</h2>

    {% if messages %}
        <div class="mb-6">
            {% for message in messages %}
                <div class="p-2 rounded-md text-center text-sm {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <h3 class="text-lg font-semibold mb-4">User Information</h3>
                <div class="mb-4">
                    <label for="first_name" class="block text-sm font-medium">First Name *</label>
                    <input type="text" id="first_name" name="first_name" value="{{ staff.user.first_name }}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                </div>
                <div class="mb-4">
                    <label for="last_name" class="block text-sm font-medium">Last Name *</label>
                    <input type="text" id="last_name" name="last_name" value="{{ staff.user.last_name }}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                </div>
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium">Username *</label>
                    <input type="text" id="username" name="username" value="{{ staff.user.username }}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium">Email *</label>
                    <input type="email" id="email" name="email" value="{{ staff.user.email }}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                </div>
            </div>
            <div>
                <h3 class="text-lg font-semibold mb-4">Staff Information</h3>
                <div class="mb-4">
                    <label for="role" class="block text-sm font-medium">Role *</label>
                    <select id="role" name="role" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                        {% for value, label in role_choices %}
                            <option value="{{ value }}" {% if value == staff.role %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label for="phone_number" class="block text-sm font-medium">Phone Number</label>
                    <input type="text" id="phone_number" name="phone_number" value="{{ staff.phone_number }}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500">
                </div>
                <div class="mb-4">
                    <label for="city" class="block text-sm font-medium">City</label>
                    <input type="text" id="city" name="city" value="{{ staff.city }}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500">
                </div>

            </div>
        </div>
        <div class="mt-6 flex justify-end space-x-4">
            <a href="{% url 'staffView' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md">Cancel</a>
            <button type="submit" class="bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 rounded-md">Update Staff</button>
        </div>
    </form>
</main>
{% endblock %}
