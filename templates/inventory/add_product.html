{% extends "base.html" %}
{% block title %}Add Product{% endblock %}

{% block content %}
<main class="p-6">
    <div class="max-w-4xl mx-auto">

        <!-- Page Header -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Add New Product</h2>
            <a href="{% url 'productView' %}"
                class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                ← Back to Products
            </a>
        </div>

        <!-- Form Card -->
        <form method="POST" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-8">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

                <!-- Left Column: Product Information -->
                <div class="space-y-5">
                    <h3 class="text-base font-semibold text-gray-700 dark:text-gray-200 pb-2 border-b border-gray-100 dark:border-gray-700">
                        Product Information
                    </h3>

                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Product Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="name" name="name" required
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                            placeholder="e.g. Rice">
                    </div>

                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Category <span class="text-red-500">*</span>
                        </label>
                        <select id="category" name="category" required
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500">
                            <option value="">Select Category</option>
                            {% for value, label in category_choices %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label for="unit" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Unit <span class="text-red-500">*</span>
                        </label>
                        <select id="unit" name="unit" required
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500">
                            <option value="">Select Unit</option>
                            {% for value, label in unit_choices %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label for="minimum_stock_level" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Minimum Stock Level
                        </label>
                        <input type="number" id="minimum_stock_level" name="minimum_stock_level" step="0.01" min="0"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                            placeholder="0.00">
                    </div>
                </div>

                <!-- Right Column: Supplier & Storage -->
                <div class="space-y-5">
                    <h3 class="text-base font-semibold text-gray-700 dark:text-gray-200 pb-2 border-b border-gray-100 dark:border-gray-700">
                        Supplier Information
                    </h3>

                    <div>
                        <label for="supplier_name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Supplier Name
                        </label>
                        <input type="text" id="supplier_name" name="supplier_name"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                            placeholder="Supplier company name">
                    </div>

                    <div>
                        <label for="supplier_contact" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Supplier Contact
                        </label>
                        <input type="text" id="supplier_contact" name="supplier_contact"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                            placeholder="Phone or email">
                    </div>

                    <h3 class="text-base font-semibold text-gray-700 dark:text-gray-200 pb-2 border-b border-gray-100 dark:border-gray-700 pt-2">
                        Storage Information
                    </h3>

                    <div>
                        <label for="storage_area" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Storage Area
                        </label>
                        <select id="storage_area" name="storage_area"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500">
                            <option value="">Select Area</option>
                            {% for storage in storage_choices %}
                                <option value="{{ storage.id }}">{{ storage.area }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="shelf_number" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                Shelf Number
                            </label>
                            <input type="text" id="shelf_number" name="shelf_number"
                                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                                placeholder="e.g. A1">
                        </div>
                        <div>
                            <label for="section" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                Section
                            </label>
                            <input type="text" id="section" name="section"
                                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                                placeholder="e.g. Dry Goods">
                        </div>
                    </div>

                    <div>
                        <label for="additional_info" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Additional Info
                        </label>
                        <textarea id="additional_info" name="additional_info" rows="3"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                            placeholder="Any additional notes..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-700">
                <a href="{% url 'productView' %}"
                    class="px-6 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    Cancel
                </a>
                <button type="submit"
                    class="px-6 py-2 bg-primary-500 hover:bg-primary-600 text-white rounded-lg text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500">
                    Add Product
                </button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
