{% extends "base.html" %}
{% block title %}Add Product{% endblock %}

{% block content %}
<main class="p-8">
    <!-- Messages -->
    {% if messages %}
        <div class="mb-6">
            {% for message in messages %}
                <div class="p-2 rounded-md text-center text-sm {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Page Header -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Add New Product</h2>
        <a href="{% url 'productView' %}">
            <button class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md">Back to Product View</button>
        </a>
    </div>

    <!-- Form Card -->
    <form method="POST" class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left Column -->
            <div>
                <h3 class="text-lg font-semibold mb-4">Product Information</h3>

                <div class="mb-4">
                    <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Product Name *</label>
                    <input type="text" id="name" name="name" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" required>
                </div>

                <div class="mb-4">
                    <label for="category" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Category *</label>
                    <select id="category" name="category" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" required>
                        <option value="">Select Category</option>
                        {% for value, label in category_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label for="unit" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Unit *</label>
                    <select id="unit" name="unit" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" required>
                        <option value="">Select Unit</option>
                        {% for value, label in unit_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label for="minimum_stock_level" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Minimum Stock Level</label>
                    <input type="number" id="minimum_stock_level" name="minimum_stock_level" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
            </div>

            <!-- Right Column -->
            <div>
                <h3 class="text-lg font-semibold mb-4">Supplier Information</h3>

                <div class="mb-4">
                    <label for="supplier_name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Supplier Name</label>
                    <input type="text" id="supplier_name" name="supplier_name" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>

                <div class="mb-4">
                    <label for="supplier_contact" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Supplier Contact</label>
                    <input type="text" id="supplier_contact" name="supplier_contact" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>

                <h3 class="text-lg font-semibold mb-4">Storage Information</h3>

                <div class="mb-4">
                    <label for="storage_area" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Storage Area</label>
                    <select id="storage_area" name="storage_area" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <option value="">Select Area</option>
                        {% for storage in storage_choices %}
                            <option value="{{ storage.id }}">{{ storage.area }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label for="shelf_number" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Shelf Number</label>
                    <input type="text" id="shelf_number" name="shelf_number" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>

                <div class="mb-4">
                    <label for="section" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Section</label>
                    <input type="text" id="section" name="section" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>

                <div class="mb-4">
                    <label for="additional_info" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Additional Info</label>
                    <textarea id="additional_info" name="additional_info" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"></textarea>
                </div>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="mt-6 flex justify-end space-x-4">
            <a href="{% url 'productView' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md">Cancel</a>
            <button type="submit" class="bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 rounded-md">Add Product</button>
        </div>
    </form>
</main>
{% endblock %}
