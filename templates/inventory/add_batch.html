{% extends "base.html" %}
{% block title %}Add Product Batch{% endblock %}

{% block content %}
<main class="p-6">
    <div class="max-w-2xl mx-auto">

        <!-- Page Header -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Add Product Batch</h2>
            <a href="{% url 'productView' %}"
                class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                ← Back to Products
            </a>
        </div>

        <!-- Form Card -->
        <form method="POST" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-8">
            {% csrf_token %}

            <h3 class="text-base font-semibold text-gray-700 dark:text-gray-200 pb-2 border-b border-gray-100 dark:border-gray-700 mb-5">
                Batch Information
            </h3>

            <div class="space-y-5">

                <!-- Product -->
                <div>
                    <label for="product" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        Product <span class="text-red-500">*</span>
                    </label>
                    <select id="product" name="product" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="">Select Product</option>
                        {% for product in products %}
                            <option value="{{ product.id }}">{{ product.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Batch Number -->
                <div>
                    <label for="batchNumber" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        Batch Number <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="batchNumber" name="batchNumber" value="{{ default_batch_number }}" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                        placeholder="e.g. BATCH-001">
                </div>

                <!-- Dates row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label for="manufacturing_date" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Manufacturing Date <span class="text-red-500">*</span>
                        </label>
                        <input type="date" id="manufacturing_date" name="manufacturing_date" required
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500">
                    </div>
                    <div>
                        <label for="expiration_date" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Expiration Date <span class="text-red-500">*</span>
                        </label>
                        <input type="date" id="expiration_date" name="expiration_date" required
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500">
                    </div>
                </div>

                <!-- Quantity & Price row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label for="quantity" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Quantity Added <span class="text-red-500">*</span>
                        </label>
                        <input type="number" id="quantity" name="quantity" step="0.01" min="0" required
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                            placeholder="0.00">
                    </div>
                    <div>
                        <label for="price" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Price per Unit (Tsh) <span class="text-red-500">*</span>
                        </label>
                        <input type="number" id="price" name="price" step="0.01" min="0" required
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                            placeholder="0.00">
                    </div>
                </div>

                <!-- Notes -->
                <div>
                    <label for="notes" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        Notes
                    </label>
                    <textarea id="notes" name="notes" rows="3"
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500"
                        placeholder="Any additional notes about this batch..."></textarea>
                </div>
            </div>

            <!-- Actions -->
            <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-700">
                <a href="{% url 'productView' %}"
                    class="px-6 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    Cancel
                </a>
                <button type="submit"
                    class="px-6 py-2 bg-primary-500 hover:bg-primary-600 text-white rounded-lg text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500">
                    Add Batch
                </button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
