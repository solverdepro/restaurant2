{% extends "base.html" %}
{% block title %}Add Product Batch{% endblock %}

{% block content %}
<main class="p-8">
    <!-- Messages -->
    {% if messages %}
        <div class="mb-6">
            {% for message in messages %}
                <div class="p-2 rounded-md text-center text-sm {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Page Header -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Add Product Batch</h2>
        <a href="{% url 'productView' %}">
            <button class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md">Back to Product View</button>
        </a>
    </div>

    <!-- Form -->
    <form method="POST" class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <h3 class="text-lg font-semibold mb-4">Batch Information</h3>
                <div class="mb-4">
                    <label for="product" class="block text-sm font-medium">Product *</label>
                    <select id="product" name="product" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                        <option value="">Select Product</option>
                        {% for product in products %}
                            <option value="{{ product.id }}">{{ product.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label for="batchNumber" class="block text-sm font-medium">Batch Number *</label>
                    <input type="text" id="batchNumber" name="batchNumber" value="{{ default_batch_number }}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                </div>
                <div class="mb-4">
                    <label for="manufacturing_date" class="block text-sm font-medium">Manufacturing Date *</label>
                    <input type="date" id="manufacturing_date" name="manufacturing_date" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                </div>
                <div class="mb-4">
                    <label for="expiration_date" class="block text-sm font-medium">Expiration Date *</label>
                    <input type="date" id="expiration_date" name="expiration_date" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                </div>
                <div class="mb-4">
                    <label for="quantity" class="block text-sm font-medium">Quantity Added *</label>
                    <input type="number" id="quantity" name="quantity" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                </div>
                <div class="mb-4">
                    <label for="price" class="block text-sm font-medium">Price per Quantity Added *</label>
                    <input type="number" id="price" name="price" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500" required>
                </div>
                <div class="mb-4">
                    <label for="notes" class="block text-sm font-medium">Notes</label>
                    <textarea id="notes" name="notes" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500"></textarea>
                </div>
            </div>
        </div>
        <div class="mt-6 flex justify-end space-x-4">
            <a href="{% url 'productView' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md">Cancel</a>
            <button type="submit" class="bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 rounded-md">Add Batch</button>
        </div>
    </form>
</main>
{% endblock %}
