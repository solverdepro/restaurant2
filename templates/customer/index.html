<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misosi Pluss++</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fef7ee',
                            100: '#fdecd6',
                            200: '#f9d5ad',
                            300: '#f3b679',
                            400: '#ec8e43',
                            500: '#e8731e',
                            600: '#d95a14',
                            700: '#b44413',
                            800: '#913717',
                            900: '#752e16',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --primary:       #e8731e;
            --primary-light: #f0943f;
            --primary-dark:  #c45c10;
            --primary-glow:  rgba(232, 115, 30, 0.55);
        }
        .bg-primary-500 {
            transition: background-color 0.2s, opacity 0.15s;
        }
        .bg-primary-500:hover { background-color: var(--primary-light) !important; }
        .bg-primary-500:active { background-color: var(--primary-dark) !important; }

        select:focus, input:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(232,115,30,0.25) !important;
            outline: none;
        }
        @keyframes toast-progress-bar { from { width: 100%; } to { width: 0%; } }
        .toast-success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
        .toast-error   { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
        .toast-warning { background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; }
        .toast-info    { background: #eff6ff; border: 1px solid #93c5fd; color: #1e40af; }
        .toast-show    { opacity: 1 !important; transform: translateX(0) !important; }
        .toast-hide    { opacity: 0 !important; transform: translateX(120%) !important; transition: opacity 0.4s ease, transform 0.4s ease !important; }

        /* Recipe cards */
        .recipe-card {
            border: 1px solid rgba(0,0,0,0.07);
            border-left: 3px solid rgba(232,115,30,0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-left-color 0.15s ease;
        }
        .recipe-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232,115,30,0.12);
            border-left-color: #e8731e;
        }
        .add-to-order:hover  { background: #d95a14 !important; transform: scale(1.06); }
        .add-to-order:active { background: #b44413 !important; transform: scale(0.97); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-200">
    <!-- Navigation Bar -->
    <nav class="bg-white dark:bg-gray-800 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-primary-600 dark:text-primary-400">Misosi Pluss++</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 01-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd" />
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 dark:hidden" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                        </svg>
                    </button>
                    <!-- <a href="{%url 'userLogin'%}"><button class="bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 rounded-md">Login</button></a> -->
                    <a href="{%url 'logout'%}"><button class="bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 rounded-md">logout</button></a>
                    <a href="{%url 'cashierDashboard'%}"><button class="bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 rounded-md">Cashier Dashboard</button></a>

               </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        <!-- Customer View (Default View) -->
        <div id="customerView">
            <h2 class="text-2xl font-bold mb-6">Today's Menu</h2>
        <!-- Toast Notification Container -->
        <div id="toast-container" style="position:fixed;top:1.25rem;right:1.25rem;z-index:9999;display:flex;flex-direction:column;gap:0.625rem;max-width:22rem;pointer-events:none;">
            {% for message in messages %}
                <div class="toast {% if message.tags == 'error' %}toast-error{% elif message.tags == 'warning' %}toast-warning{% elif message.tags == 'info' %}toast-info{% else %}toast-success{% endif %}" role="alert" style="pointer-events:all;display:flex;align-items:flex-start;gap:0.75rem;padding:0.875rem 1rem;border-radius:0.75rem;box-shadow:0 8px 24px rgba(0,0,0,0.15);font-size:0.875rem;font-weight:500;opacity:0;transform:translateX(120%);transition:opacity 0.35s ease,transform 0.35s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden;">
                    <span>{{ message }}</span>
                    <button class="toast-close" aria-label="Close" style="margin-left:auto;cursor:pointer;opacity:0.6;background:none;border:none;color:inherit;">&#x2715;</button>
                    <div style="position:absolute;bottom:0;left:0;height:3px;border-radius:0 0 0.75rem 0.75rem;animation:toast-progress-bar 5s linear forwards;{% if message.tags == 'error' %}background:#ef4444;{% elif message.tags == 'warning' %}background:#f59e0b;{% elif message.tags == 'info' %}background:#3b82f6;{% else %}background:#22c55e;{% endif %}"></div>
                </div>
            {% endfor %}
        </div>

           <!-- Search Bar -->
            <div class="mb-6">
             <input type="text" id="searchInput" placeholder="Search recipes..." class="w-full md:w-1/2 px-4 py-2 border rounded-md dark:border-gray-600 dark:bg-gray-700"/>
            </div>

            <!-- Menu Filters -->
           <div class="flex flex-wrap gap-4 mb-6">
                <button id="allItems" class="bg-primary-500 text-white px-4 py-2 rounded-md">All Items</button>
                <button id="mainCourse" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-4 py-2 rounded-md">Main Course</button>
                <button id="drinks" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-4 py-2 rounded-md">Drinks</button>
            </div>
            <!-- Menu Grid -->
            <div id="menuGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                <!-- Recipes will be populated by JavaScript -->
            </div>
            
            <!-- Order Summary -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 mb-8">
                <h3 class="text-xl font-semibold mb-4">Current Order</h3>
                <div id="orderItems" class="border-b dark:border-gray-700 pb-4 mb-4">
                    <!-- Order items will be populated by JavaScript -->
                </div>
                <div class="flex justify-between font-bold text-lg">
                    <span>Total</span>
                    <span id="orderTotal">0.00(Tsh)</span>
                </div>
                <form id="orderForm" method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="action" id="formAction">
                    <input type="hidden" name="order_items[]" id="orderItemsInput" multiple>
                    <div class="mt-6 flex justify-end space-x-4">
                        <button type="button" id="clearOrder" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-4 py-2 rounded-md">Clear Order</button>
                        <a href="{% url 'orderConfirmation'%}"><button type="submit" id="confirmOrder" class="bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 rounded-md">Confirm Order</button></a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white dark:bg-gray-800 shadow-md mt-8 py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-600 dark:text-gray-400">
    <p>&copy; Misosi Pluss++. All rights reserved.</p>
        </div>
    </footer>

        <script>
        // Toggle theme
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Check for saved theme preference or respect OS preference
                document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        });

        // Order management
        let orders = []; // Store orders: [{id, name, price, quantity}, ...]

        function updateOrderDisplay() {
            const orderItemsDiv = document.getElementById('orderItems');
            orderItemsDiv.innerHTML = orders.length === 0 
                ? '<p class="text-gray-600 dark:text-gray-400">No items in order.</p>'
                : '';
            
            let total = 0;
            orders.forEach(order => {
                const itemTotal = order.price * order.quantity;
                total += itemTotal;
                const div = document.createElement('div');
                div.className = 'flex justify-between mb-2';
                div.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span>${order.name} - ${order.quantity}</span>
                        <input type="number" min="1" value="${order.quantity}" 
                               data-id="${order.id}" class="quantity-input w-16 p-1 border rounded dark:border-gray-600 dark:bg-gray-700" />
                    </div>
                    <span>${itemTotal.toFixed(2)}(Tsh)</span>
                `;
                orderItemsDiv.appendChild(div);
            });

            document.getElementById('orderTotal').textContent = `${total.toFixed(2)}(Tsh)`;
            document.querySelectorAll('input[name="order_items[]"]').forEach(e => e.remove());

                    // Add a hidden input for each order
                    orders.forEach(o => {
                        const input = document.createElement('input');
                                input.type = 'hidden';
                                input.name = 'order_items[]';
                                input.value = `${o.id}:${o.quantity}`;
                                document.getElementById('orderForm').appendChild(input);
                            });
        }

        // Populate menu
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            // Recipes from Django
            const recipes = [
                {% for recipe in recipes %}
                    {
                        id: {{ recipe.id }},
                        name: "{{ recipe.name|escapejs }}",
                        description: "{{ recipe.description|escapejs }}",
                        category: "{{ recipe.category|escapejs }}",
                        price: {{ recipe.price|floatformat:2|add:"0" }}
                    }{% if not forloop.last %},{% endif %}
                {% endfor %}
            ];

            const menuGrid = document.getElementById('menuGrid');
            const allItemsBtn = document.getElementById('allItems');
            const mainCourseBtn = document.getElementById('mainCourse');
            const drinksBtn = document.getElementById('drinks');

            function displayRecipes(filter = 'all', searchQuery = '') {
                menuGrid.innerHTML = '';
                let filteredRecipes = filter === 'all' 
                    ? recipes 
                    : recipes.filter(r => r.category === (filter === 'main' ? 'Main Course' : 'Beverage'));
            
                if (searchQuery) {
                    filteredRecipes = filteredRecipes.filter(r =>
                        r.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        r.description.toLowerCase().includes(searchQuery.toLowerCase())
                    );
                }
            
                if (filteredRecipes.length === 0) {
                    menuGrid.innerHTML = '<p class="text-gray-600 dark:text-gray-400 col-span-full text-center">No items available.</p>';
                    return;
                }

                filteredRecipes.forEach(recipe => {
                    const div = document.createElement('div');
                    div.className = 'recipe-card bg-white dark:bg-gray-800 rounded-xl shadow-sm overflow-hidden';
                    div.innerHTML = `
                        <div class="recipe-card-header flex items-center gap-2 px-3 py-2" style="background:rgba(232,115,30,0.08);border-bottom:1px solid rgba(232,115,30,0.15);">
                            <svg style="width:18px;height:18px;color:#e8731e;flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0A1.5 1.5 0 013 15.546V5a1 1 0 011-1h16a1 1 0 011 1v10.546z"/>
                            </svg>
                            <span style="font-size:0.7rem;font-weight:600;letter-spacing:0.05em;color:#e8731e;text-transform:uppercase;">${recipe.category || 'Menu'}</span>
                        </div>
                        <div class="p-3">
                            <h3 style="font-size:0.9rem;font-weight:700;margin:0 0 0.2rem 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${recipe.name}">${recipe.name}</h3>
                            <p style="font-size:0.76rem;color:#6b7280;margin:0 0 0.6rem 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;">${recipe.description || 'No description available'}</p>
                            <div class="flex justify-between items-center">
                                <span style="font-size:0.85rem;font-weight:700;color:#e8731e;">${recipe.price.toFixed(2)} Tsh</span>
                                <button data-id="${recipe.id}" class="add-to-order" style="background:#e8731e;color:#fff;border:none;padding:0.3rem 0.75rem;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;transition:background 0.15s,transform 0.1s;">+ Add</button>
                            </div>
                        </div>
                    `;
                    menuGrid.appendChild(div);
                });
            }




            document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value;
    const activeFilter = 
        allItemsBtn.classList.contains('bg-primary-500') ? 'all' :
        mainCourseBtn.classList.contains('bg-primary-500') ? 'Main Course' : 'drinks';
    
    displayRecipes(activeFilter, query);
});

            // Filter button handlers
            allItemsBtn.addEventListener('click', () => {
                allItemsBtn.classList.add('bg-primary-500', 'text-white');
                allItemsBtn.classList.remove('bg-gray-200', 'dark:bg-gray-700');
                mainCourseBtn.classList.remove('bg-primary-500', 'text-white');
                mainCourseBtn.classList.add('bg-gray-200', 'dark:bg-gray-700');
                drinksBtn.classList.remove('bg-primary-500', 'text-white');
                drinksBtn.classList.add('bg-gray-200', 'dark:bg-gray-700');
                displayRecipes('all');
            });

            mainCourseBtn.addEventListener('click', () => {
                mainCourseBtn.classList.add('bg-primary-500', 'text-white');
                mainCourseBtn.classList.remove('bg-gray-200', 'dark:bg-gray-700');
                allItemsBtn.classList.remove('bg-primary-500', 'text-white');
                allItemsBtn.classList.add('bg-gray-200', 'dark:bg-gray-700');
                drinksBtn.classList.remove('bg-primary-500', 'text-white');
                drinksBtn.classList.add('bg-gray-200', 'dark:bg-gray-700');
                displayRecipes('main');
            });

            drinksBtn.addEventListener('click', () => {
                drinksBtn.classList.add('bg-primary-500', 'text-white');
                drinksBtn.classList.remove('bg-gray-200', 'dark:bg-gray-700');
                allItemsBtn.classList.remove('bg-primary-500', 'text-white');
                allItemsBtn.classList.add('bg-gray-200', 'dark:bg-gray-700');
                mainCourseBtn.classList.remove('bg-primary-500', 'text-white');
                mainCourseBtn.classList.add('bg-gray-200', 'dark:bg-gray-700');
                displayRecipes('drinks');
            });

            // Add to order
            menuGrid.addEventListener('click', (e) => {
                if (e.target.classList.contains('add-to-order')) {
                    const recipeId = e.target.getAttribute('data-id');
                    const recipe = recipes.find(r => r.id == recipeId);
                    if (!recipe) return;
                    
                    const existingOrder = orders.find(o => o.id == recipeId);
                    if (existingOrder) {
                        existingOrder.quantity += 1;
                    } else {
                        orders.push({
                            id: recipe.id,
                            name: recipe.name,
                            price: recipe.price,
                            quantity: 1
                        });
                    }
                    updateOrderDisplay();
                }
            });

            // Update quantity
            document.getElementById('orderItems').addEventListener('change', (e) => {
                if (e.target.classList.contains('quantity-input')) {
                    const recipeId = e.target.getAttribute('data-id');
                    const newQuantity = parseInt(e.target.value);
                    if (newQuantity < 1) {
                        orders = orders.filter(o => o.id != recipeId);
                    } else {
                        const order = orders.find(o => o.id == recipeId);
                        if (order) order.quantity = newQuantity;
                    }
                    updateOrderDisplay();
                }
            });

            // Clear order
            document.getElementById('clearOrder').addEventListener('click', () => {
                orders = [];
                updateOrderDisplay();
            });

            // Confirm order
            document.getElementById('confirmOrder').addEventListener('click', () => {
                document.getElementById('formAction').value = 'confirm_order';
                document.getElementById('orderItemsInput').value = orders.map(o => `${o.id}:${o.quantity}`).join(',');
            });

            // Initial display
            allItemsBtn.classList.add('bg-primary-500', 'text-white');
            displayRecipes('all');
           });

            // Toast Manager
         document.addEventListener('DOMContentLoaded', function () {
            const toasts = document.querySelectorAll('#toast-container .toast');
            toasts.forEach(function (toast, index) {
                setTimeout(function () { toast.classList.add('toast-show'); }, index * 120);
                const autoDismiss = setTimeout(function () { dismissToast(toast); }, 5000 + index * 120);
                const closeBtn = toast.querySelector('.toast-close');
                if (closeBtn) closeBtn.addEventListener('click', function () { clearTimeout(autoDismiss); dismissToast(toast); });
            });
            function dismissToast(t) {
                t.classList.remove('toast-show'); t.classList.add('toast-hide');
                setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 420);
            }
        });
    </script>
</body>
</html>
